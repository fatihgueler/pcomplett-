<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>LinkedIn-Vorlage: Stellenausschreibung</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:627px; overflow:hidden;
    font-family:'IBM Plex Sans', sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    position:relative;
  }
  .grid { position:absolute; inset:0; background-image:
    linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
    background-size:44px 44px; }
  .content { position:relative; height:100%; display:flex; flex-direction:column;
    justify-content:center; padding:72px; gap:22px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .brand span { font-size:24px; font-weight:700; color:#fff; }
  .brand span b { color:#c1121f; }
  .eyebrow { display:inline-flex; align-items:center; gap:8px; width:fit-content;
    font-family:'IBM Plex Mono', monospace; font-size:14px; font-weight:500;
    letter-spacing:.2em; text-transform:uppercase; color:#fff; opacity:.9;
    border-left:3px solid #c1121f; padding:6px 14px; background:rgba(255,255,255,.06); }
  h1 { font-size:52px; font-weight:700; color:#fff; line-height:1.1; max-width:820px; }
  p { font-size:22px; color:rgba(255,255,255,.75); max-width:720px; line-height:1.5; }
  .cta { display:inline-flex; align-items:center; gap:10px; width:fit-content;
    background:#c1121f; color:#fff; font-weight:600; font-size:20px;
    padding:14px 28px; border-radius:6px; margin-top:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:#c1121f; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="content">
    <div class="brand">
      <svg viewBox="4 22 130 130" width="36" height="36" fill="none">
        <path d="M 48 138 L 48 34 L 100 34 Q 122 34 122 62 Q 122 90 100 90 L 66 90" stroke="#c1121f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 48 116 L 22 116" stroke="#c1121f" stroke-width="8" stroke-linecap="round"/>
        <circle cx="48" cy="138" r="9" fill="#0f172a"/><circle cx="66" cy="90" r="9" fill="#0f172a"/><circle cx="16" cy="116" r="6" fill="#0f172a"/>
      </svg>
      <span>PComplett<b>-IT</b></span>
    </div>
    <span class="eyebrow"><span class="dot"></span>Wir stellen ein</span>
    <h1>{{JOB_TITEL}}</h1>
    <p>{{JOB_KURZBESCHREIBUNG}} &middot; Hannover &middot; {{JOB_ART, z. B. Vollzeit}}</p>
    <span class="cta">Jetzt bewerben &rarr;</span>
  </div>
</body>
</html>
