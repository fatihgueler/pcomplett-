<!doctype html>

<style>

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:1200px; overflow:hidden;
    font-family:'IBM Plex Sans', sans-serif;
    background:#0f172a;

  .brand span { font-size:26px; font-weight:700; color:#fff; }

  blockquote { font-size:44px; font-weight:600; color:#fff; line-height:1.28;
    max-width:900px; }
  .author { display:flex; flex-direction:column; gap:4px; border-top:1px solid rgba(255,255,255,.2);
    padding-top:20px; margin-top:8px; }
  .author b { font-size:24px; color:#fff; }
  .author span { font-size:16px; color:rgba(255,255,255,.6); font-family:'IBM Plex Mono', monospace;
    letter-spacing:.05em; }

</head>
<body>
